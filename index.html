<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Required</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #08080c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px 30px;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 60px;
        }

        .rocket-container {
            margin-bottom: 25px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .update-card {
            background-color: #111112;
            width: 100%;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
        }

        .version-text {
            color: #d82222;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        .changelog {
            color: #aaaaaa;
            font-size: 14px;
            line-height: 1.8;
            direction: rtl;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-update {
            background-color: #c10e0e;
            color: #ffffff;
            border: none;
        }

        .btn-close {
            background-color: transparent;
            color: #aaaaaa;
            border: 1px solid #222222;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-content">
            <div class="rocket-container">
                <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- ئاگر -->
                    <path d="M 52 75 L 60 100 L 68 75 Z" fill="#e53935"/>
                    <path d="M 56 75 L 60 90 L 64 75 Z" fill="#ffb300"/>
                    
                    <!-- دویکێل / بناغە -->
                    <path d="M 25 105 C 45 105 45 85 55 80 C 58 78 62 78 65 80 C 75 85 75 105 95 105 Z" fill="#fce4ec"/>
                    
                    <!-- لەشێ موشەکێ -->
                    <path d="M 60 15 C 75 35 72 65 68 80 L 52 80 C 48 65 45 35 60 15 Z" fill="#e53935"/>
                    
                    <!-- باڵێن موشەکێ -->
                    <path d="M 53 55 C 40 65 40 80 40 80 L 52 80 Z" fill="#b71c1c"/>
                    <path d="M 67 55 C 80 65 80 80 80 80 L 68 80 Z" fill="#b71c1c"/>
                    
                    <!-- پەنجەرە -->
                    <circle cx="60" cy="45" r="7" fill="#ffffff"/>
                    <circle cx="60" cy="45" r="3" fill="#ef9a9a"/>
                </svg>
            </div>
            
            <h1>Update Required</h1>
            
            <div class="update-card">
                <div class="version-text">New version available — 1.5.0</div>
                <div class="changelog">
                    إصلاحات وتحسينات في الأداء<br>
                    تحسين السرعة<br>
                    إصلاح مشكلة الترجمة
                </div>
            </div>
        </div>

        <div class="button-group">
            <!-- لینک ل ڤێرە هاتە زێدەکرن -->
            <button class="btn btn-update" onclick="window.location.href='https://stvplus1.github.io/Stv/app-debug.apk'">Update Now</button>
            <button class="btn btn-close" onclick="window.close()">Close App</button>
        </div>
    </div>

</body>
</html>
